{% extends "command_base.html" %}
{% block title %}المهام · مدار أمني{% endblock %}
{% block content %}
<div class="dash-mid" style="grid-template-columns:1fr 1fr">
  <article class="ops-card">
    <div class="ops-card-head"><h2>إنشاء مهمة</h2></div>
    <form method="post" class="form-grid">
      <input type="hidden" name="action" value="create" />
      <input name="title" placeholder="عنوان المهمة" required />
      <textarea name="description" rows="3" placeholder="التفاصيل"></textarea>
      <select name="assignee_id">
        <option value="">اختر الضابط</option>
        {% for o in officers %}<option value="{{ o.id }}">{{ o.name }}</option>{% endfor %}
      </select>
      <select name="priority">
        <option value="critical">critical</option>
        <option value="high" selected>high</option>
        <option value="medium">medium</option>
      </select>
      <button class="btn primary" type="submit">إسناد</button>
    </form>
  </article>
  <article class="ops-card">
    <div class="ops-card-head"><h2>قائمة المهام</h2></div>
    {% for t in tasks %}
    <div class="alert-item">
      <div class="alert-ico"><i class="fa-solid fa-clipboard-list"></i></div>
      <div>
        <strong>{{ t.title }}</strong>
        <p>{{ t.priority }} · {{ t.status }}</p>
      </div>
    </div>
    {% endfor %}
  </article>
</div>
{% endblock %}
